<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">Influencer campaign dashboard visual</title>
  <desc id="desc">A stylized campaign dashboard with content cards and performance charts.</desc>
  <defs>
